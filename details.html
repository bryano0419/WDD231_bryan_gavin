<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details | BookQuest</title>
    <link rel="stylesheet" href="./base.css">
</head>
<body>
    <header>
        <h1>BookQuest</h1>
        <nav>
            <ul>
                <li><a href="./index.html">← Back to Search</a></li>
            </ul>
        </nav>
    </header>

    <main id="details-container">
        <div class="book-card detail-view">
            <h2 id="book-title">Loading book details...</h2>
            <p id="author-label"><strong>Author/ID:</strong> <span id="book-author">...</span></p>
            <div class="description-box">
                <p><strong>Description:</strong></p>
                <p id="book-desc">Fetching the summary from Open Library...</p>
            </div>
            
            <div id="details-loader" class="loader-small"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 BookQuest Team</p>
    </footer>

    <script type="module" src="./js/details.js"></script>
</body>
</html>
